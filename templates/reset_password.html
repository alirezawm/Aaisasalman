{% extends "base.html" %}

{% block title %}تغییر رمز عبور - شرکت بازرگانی قطعات خودرو آسیا سلمان{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-success text-white text-center">
                    <h4 class="mb-0">
                        <i class="fas fa-key me-2"></i>تغییر رمز عبور
                    </h4>
                </div>
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-lock fa-3x text-success mb-3"></i>
                        <p class="text-muted">
                            لطفاً رمز عبور جدید خود را وارد کنید
                        </p>
                    </div>
                    
                    <form method="POST" id="reset-password-form">
                        <div class="mb-3">
                            <label for="new_password" class="form-label">رمز عبور جدید</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" 
                                       class="form-control" 
                                       id="new_password" 
                                       name="new_password" 
                                       placeholder="رمز عبور جدید"
                                       required
                                       minlength="6"
                                       autocomplete="new-password">
                                <button type="button" 
                                        class="btn btn-outline-secondary" 
                                        id="toggleNewPassword"
                                        title="نمایش/مخفی کردن رمز عبور">
                                    <i class="fas fa-eye" id="toggleNewPasswordIcon"></i>
                                </button>
                            </div>
                            <div class="form-text">حداقل 6 کاراکتر</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">تأیید رمز عبور</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" 
                                       class="form-control" 
                                       id="confirm_password" 
                                       name="confirm_password" 
                                       placeholder="تأیید رمز عبور"
                                       required
                                       minlength="6"
                                       autocomplete="new-password">
                                <button type="button" 
                                        class="btn btn-outline-secondary" 
                                        id="toggleConfirmPassword"
                                        title="نمایش/مخفی کردن رمز عبور">
                                    <i class="fas fa-eye" id="toggleConfirmPasswordIcon"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-success btn-lg" id="submitBtn">
                                <i class="fas fa-save me-2"></i>تغییر رمز عبور
                            </button>
                        </div>
                        
                        <div class="text-center">
                            <a href="{{ url_for('login') }}" class="text-decoration-none">
                                <i class="fas fa-arrow-right me-1"></i>بازگشت به صفحه ورود
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('reset-password-form');
    const newPasswordInput = document.getElementById('new_password');
    const confirmPasswordInput = document.getElementById('confirm_password');
    const submitBtn = document.getElementById('submitBtn');
    const toggleNewPasswordBtn = document.getElementById('toggleNewPassword');
    const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPassword');
    const toggleNewPasswordIcon = document.getElementById('toggleNewPasswordIcon');
    const toggleConfirmPasswordIcon = document.getElementById('toggleConfirmPasswordIcon');
    
    // Toggle password visibility for new password
    toggleNewPasswordBtn.addEventListener('click', function() {
        const type = newPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        newPasswordInput.setAttribute('type', type);
        
        if (type === 'text') {
            toggleNewPasswordIcon.classList.remove('fa-eye');
            toggleNewPasswordIcon.classList.add('fa-eye-slash');
        } else {
            toggleNewPasswordIcon.classList.remove('fa-eye-slash');
            toggleNewPasswordIcon.classList.add('fa-eye');
        }
    });
    
    // Toggle password visibility for confirm password
    toggleConfirmPasswordBtn.addEventListener('click', function() {
        const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        confirmPasswordInput.setAttribute('type', type);
        
        if (type === 'text') {
            toggleConfirmPasswordIcon.classList.remove('fa-eye');
            toggleConfirmPasswordIcon.classList.add('fa-eye-slash');
        } else {
            toggleConfirmPasswordIcon.classList.remove('fa-eye-slash');
            toggleConfirmPasswordIcon.classList.add('fa-eye');
        }
    });
    
    // Real-time password match validation
    confirmPasswordInput.addEventListener('input', function() {
        if (this.value && newPasswordInput.value) {
            if (this.value !== newPasswordInput.value) {
                this.setCustomValidity('رمزهای عبور مطابقت ندارند');
            } else {
                this.setCustomValidity('');
            }
        }
    });
    
    newPasswordInput.addEventListener('input', function() {
        if (confirmPasswordInput.value && this.value !== confirmPasswordInput.value) {
            confirmPasswordInput.setCustomValidity('رمزهای عبور مطابقت ندارند');
        } else {
            confirmPasswordInput.setCustomValidity('');
        }
    });
    
    // Handle form submission
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        
        // Validate inputs
        if (!newPassword) {
            showAlert('لطفاً رمز عبور جدید را وارد کنید', 'danger');
            newPasswordInput.focus();
            return;
        }
        
        if (newPassword.length < 6) {
            showAlert('رمز عبور باید حداقل 6 کاراکتر باشد', 'danger');
            newPasswordInput.focus();
            return;
        }
        
        if (!confirmPassword) {
            showAlert('لطفاً تأیید رمز عبور را وارد کنید', 'danger');
            confirmPasswordInput.focus();
            return;
        }
        
        if (newPassword !== confirmPassword) {
            showAlert('رمزهای عبور مطابقت ندارند', 'danger');
            confirmPasswordInput.focus();
            return;
        }
        
        // Disable button and show loading
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>در حال تغییر...';
        
        // Submit form
        form.submit();
    });
    
    function showAlert(message, type) {
        // Remove existing alerts
        const existingAlerts = document.querySelectorAll('.alert');
        existingAlerts.forEach(alert => alert.remove());
        
        // Create new alert
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        
        // Insert at top of card body
        const cardBody = document.querySelector('.card-body');
        cardBody.insertBefore(alertDiv, cardBody.firstChild);
        
        // Auto-remove after 5 seconds
        setTimeout(() => {
            if (alertDiv.parentNode) {
                alertDiv.remove();
            }
        }, 5000);
    }
    
    // Focus on new password input
    newPasswordInput.focus();
});
</script>
{% endblock %}
