{% extends "base.html" %}

{% block title %}مدیریت نقش‌های کاربران{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="card-title">مدیریت نقش‌های کاربران</h3>
                </div>
                <div class="card-body">
                    <!-- User Selection -->
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="userSelect" class="form-label">انتخاب کاربر</label>
                            <select class="form-select" id="userSelect" onchange="loadUserRoles()">
                                <option value="">انتخاب کاربر...</option>
                                {% for user in users.items %}
                                <option value="{{ user.id }}">
                                    {{ user.full_name }} ({{ user.username }})
                                    {% if user.is_bulk_buyer %} - خریدار عمده{% endif %}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="scopeSelect" class="form-label">دامنه</label>
                            <select class="form-select" id="scopeSelect" onchange="loadUserRoles()">
                                <option value="site">سایت</option>
                                <option value="tenant">مستأجر</option>
                                <option value="store">فروشگاه</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button type="button" class="btn btn-outline-secondary" onclick="refreshUserRoles()">
                                <i class="fas fa-refresh"></i> به‌روزرسانی
                            </button>
                        </div>
                    </div>

                    <!-- User Info -->
                    <div id="userInfo" class="row mb-3" style="display: none;">
                        <div class="col-12">
                            <div class="card bg-light">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-3">
                                            <strong>نام کاربری:</strong> <span id="userUsername"></span>
                                        </div>
                                        <div class="col-md-3">
                                            <strong>نام کامل:</strong> <span id="userFullName"></span>
                                        </div>
                                        <div class="col-md-3">
                                            <strong>ایمیل:</strong> <span id="userEmail"></span>
                                        </div>
                                        <div class="col-md-3">
                                            <strong>وضعیت:</strong> <span id="userStatus"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Current Roles -->
                    <div class="row">
                        <div class="col-md-8">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">نقش‌های فعلی</h5>
                                </div>
                                <div class="card-body">
                                    <div id="currentRoles" class="table-responsive">
                                        <!-- Current roles will be loaded here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="card-title">اختصاص نقش جدید</h5>
                                </div>
                                <div class="card-body">
                                    <form id="assignRoleForm">
                                        <div class="mb-3">
                                            <label for="roleSelect" class="form-label">نقش</label>
                                            <select class="form-select" id="roleSelect" required>
                                                <option value="">انتخاب نقش...</option>
                                                {% for role in roles %}
                                                <option value="{{ role.slug }}">{{ role.name }} ({{ role.slug }})</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        
                                        <div class="mb-3">
                                            <label for="auditReason" class="form-label">دلیل اختصاص *</label>
                                            <textarea class="form-control" id="auditReason" rows="3" required placeholder="دلیل اختصاص این نقش را وارد کنید..."></textarea>
                                        </div>
                                        
                                        <button type="submit" class="btn btn-primary w-100">
                                            <i class="fas fa-plus"></i> اختصاص نقش
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Revoke Role Confirmation Modal -->
<div class="modal fade" id="revokeRoleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">تایید لغو نقش</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>آیا مطمئن هستید که می‌خواهید نقش <strong id="revokeRoleName"></strong> را از کاربر <strong id="revokeUserName"></strong> لغو کنید؟</p>
                
                <div class="mb-3">
                    <label for="revokeAuditReason" class="form-label">دلیل لغو نقش *</label>
                    <textarea class="form-control" id="revokeAuditReason" rows="3" required placeholder="دلیل لغو این نقش را وارد کنید..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">انصراف</button>
                <button type="button" class="btn btn-danger" onclick="confirmRevokeRole()">لغو نقش</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentUserId = null;
let currentUserData = null;
let availableRoles = [
    {% for role in roles %}
    {
        "slug": "{{ role.slug }}",
        "name": "{{ role.name }}"
    }{% if not loop.last %},{% endif %}
    {% endfor %}
];
let currentUserRoles = [];

// Load users and roles on page load
document.addEventListener('DOMContentLoaded', function() {
    // Assign role form
    document.getElementById('assignRoleForm').addEventListener('submit', function(e) {
        e.preventDefault();
        assignRole();
    });
});

function loadUserRoles() {
    const userId = document.getElementById('userSelect').value;
    const scope = document.getElementById('scopeSelect').value;
    
    if (!userId) {
        document.getElementById('userInfo').style.display = 'none';
        document.getElementById('currentRoles').innerHTML = '<p class="text-muted">لطفاً کاربری را انتخاب کنید</p>';
        return;
    }
    
    currentUserId = userId;
    
    // Load user info from the select option
    const selectedOption = document.getElementById('userSelect').selectedOptions[0];
    const userText = selectedOption.textContent;
    
    // Extract user info from the option text
    const userMatch = userText.match(/(.+?)\s*\((.+?)\)/);
    if (userMatch) {
        const fullName = userMatch[1];
        const username = userMatch[2];
        
        document.getElementById('userUsername').textContent = username;
        document.getElementById('userFullName').textContent = fullName;
        document.getElementById('userEmail').textContent = 'N/A'; // Email not shown in select
        
        // Show user status
        let statusHtml = '<span class="badge bg-success">فعال</span>';
        if (userText.includes('خریدار عمده')) {
            statusHtml += ' <span class="badge bg-primary ms-1">خریدار عمده</span>';
        }
        
        document.getElementById('userStatus').innerHTML = statusHtml;
        document.getElementById('userInfo').style.display = 'block';
    }
    
    const currentRolesEl = document.getElementById('currentRoles');
    currentRolesEl.innerHTML = '<p class="text-muted">نقش‌های کاربر در حال بارگذاری...</p>';

    fetch(`/api/v1/users/${userId}/roles`, {
        method: 'GET',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(response => {
        if (response.status === 302 || response.redirected) {
            window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
            return;
        }
        return response.json();
    })
    .then(data => {
        if (!data) return;
        currentUserRoles = data.roles || [];
        const roles = currentUserRoles.filter(r => !scope || r.scope === scope);
        if (roles.length === 0) {
            currentRolesEl.innerHTML = '<p class="text-muted">نقشی اختصاص داده نشده است</p>';
            return;
        }
        const tableHtml = `
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>نقش</th>
                        <th>دامنه</th>
                        <th>وضعیت</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody>
                    ${roles.map(r => `
                        <tr>
                            <td>${r.role_name} <span class="text-muted small">(${r.role_slug})</span></td>
                            <td><span class="badge bg-secondary">${r.scope}</span></td>
                            <td><span class="badge ${r.is_active ? 'bg-success' : 'bg-secondary'}">${r.is_active ? 'فعال' : 'غیرفعال'}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger" onclick="openRevoke('${r.role_slug}')">لغو</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        currentRolesEl.innerHTML = tableHtml;
    })
    .catch(() => {
        currentRolesEl.innerHTML = '<p class="text-danger">خطا در دریافت نقش‌های کاربر</p>';
    });
}

function assignRole() {
    const roleSlug = document.getElementById('roleSelect').value;
    const auditReason = document.getElementById('auditReason').value;
    const userId = document.getElementById('userSelect').value;
    
    if (!roleSlug || !auditReason) {
        showAlert('لطفاً همه فیلدهای اجباری را پر کنید', 'error');
        return;
    }
    if (!userId) {
        showAlert('ابتدا یک کاربر انتخاب کنید', 'error');
        return;
    }

    fetch(`/api/v1/users/${userId}/roles`, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role_slug: roleSlug, scope: 'site', audit_reason: auditReason })
    })
    .then(response => {
        if (response.status === 302 || response.redirected) {
            window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
            return;
        }
        return response.json();
    })
    .then(data => {
        if (data && data.error) {
            showAlert('خطا در اختصاص نقش: ' + data.error, 'error');
        } else {
            showAlert('نقش با موفقیت اختصاص داده شد', 'success');
            document.getElementById('assignRoleForm').reset();
            loadUserRoles();
        }
    })
    .catch(() => {
        showAlert('خطا در اختصاص نقش', 'error');
    });
}

function openRevoke(roleSlug) {
    const userSel = document.getElementById('userSelect');
    const userName = userSel.options[userSel.selectedIndex].text;
    const role = (currentUserRoles || []).find(r => r.role_slug === roleSlug) || { role_name: roleSlug };
    document.getElementById('revokeRoleName').textContent = role.role_name || roleSlug;
    document.getElementById('revokeUserName').textContent = userName;
    const modal = new bootstrap.Modal(document.getElementById('revokeRoleModal'));
    document.getElementById('revokeRoleModal').dataset.roleSlug = roleSlug;
    modal.show();
}

function confirmRevokeRole() {
    const roleSlug = document.getElementById('revokeRoleModal').dataset.roleSlug;
    const auditReason = document.getElementById('revokeAuditReason').value;
    const userId = document.getElementById('userSelect').value;
    if (!auditReason) {
        showAlert('دلیل لغو نقش الزامی است', 'error');
        return;
    }
    fetch(`/api/v1/users/${userId}/roles/${roleSlug}`, {
        method: 'DELETE',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scope: 'site', audit_reason: auditReason })
    })
    .then(response => {
        if (response.status === 302 || response.redirected) {
            window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname);
            return;
        }
        return response.json();
    })
    .then(data => {
        if (data && data.error) {
            showAlert('خطا در لغو نقش: ' + data.error, 'error');
        } else {
            showAlert('نقش با موفقیت لغو شد', 'success');
            document.getElementById('revokeAuditReason').value = '';
            bootstrap.Modal.getInstance(document.getElementById('revokeRoleModal')).hide();
            loadUserRoles();
        }
    })
    .catch(() => {
        showAlert('خطا در لغو نقش', 'error');
    });
}

function refreshUserRoles() {
    if (currentUserId) {
        loadUserRoles();
    }
}

function showAlert(message, type) {
    const alertClass = type === 'error' ? 'alert-danger' : 
                      type === 'success' ? 'alert-success' : 
                      type === 'info' ? 'alert-info' : 'alert-warning';
    
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert ${alertClass} alert-dismissible fade show`;
    alertDiv.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    `;
    
    // Insert at the top of the card body
    const cardBody = document.querySelector('.card-body');
    cardBody.insertBefore(alertDiv, cardBody.firstChild);
    
    // Auto-dismiss after 5 seconds
    setTimeout(() => {
        if (alertDiv.parentNode) {
            alertDiv.remove();
        }
    }, 5000);
}
</script>
{% endblock %}
