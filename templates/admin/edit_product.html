{% extends "base.html" %}

{% block title %}ویرایش محصول - شرکت بازرگانی قطعات خودرو آسیا سلمان{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <!-- Admin Sidebar -->
        <div class="col-lg-2">
            <div class="admin-sidebar">
                <div class="p-3">
                    <h5 class="text-white mb-4">
                        <i class="fas fa-cog me-2"></i>مدیریت سایت
                    </h5>
                    <nav class="nav flex-column">
                        <a class="nav-link" href="{{ url_for('admin_dashboard') }}">
                            <i class="fas fa-tachometer-alt me-2"></i>داشبورد
                        </a>
                        
                        <a class="nav-link active" href="{{ url_for('admin_products') }}">
                            <i class="fas fa-boxes me-2"></i>محصولات
                        </a>
                        <a class="nav-link" href="{{ url_for('admin_brands') }}">
                            <i class="fas fa-star me-2"></i>برندها
                        </a>
                        <a class="nav-link" href="{{ url_for('admin_vehicle_types') }}">
                            <i class="fas fa-car me-2"></i>انواع خودرو
                        </a>
                        <a class="nav-link" href="{{ url_for('admin_announcements') }}">
                            <i class="fas fa-bullhorn me-2"></i>اطلاعیه‌ها
                        </a>
                        <a class="nav-link" href="{{ url_for('admin_company_info') }}">
                            <i class="fas fa-building me-2"></i>اطلاعات شرکت
                        </a>
                        <a class="nav-link" href="{{ url_for('excel_reconstruction') }}">
                            <i class="fas fa-file-excel me-2"></i>بازسازی اکسل
                        </a>
                    </nav>
                </div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="col-lg-10">
            <!-- Edit Product Form -->
            <div class="card">
                <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">
                        <i class="fas fa-edit me-2"></i>ویرایش محصول: {{ product.name }}
                    </h5>
                    <a href="{{ url_for('admin_products') }}" class="btn btn-light btn-sm">
                        <i class="fas fa-arrow-right me-2"></i>بازگشت به لیست
                    </a>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin_edit_product', product_id=product.id) }}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="code" class="form-label">کد کالا *</label>
                                <input type="text" class="form-control" id="code" name="code" value="{{ product.code }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="name" class="form-label">نام کالا *</label>
                                <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
                            </div>
                            <div class="col-12">
                                <label for="description" class="form-label">توضیحات</label>
                                <textarea class="form-control" id="description" name="description" rows="3">{{ product.description or '' }}</textarea>
                            </div>
                            <div class="col-md-6">
                                <label for="brand_id" class="form-label">برند</label>
                                <select class="form-select" id="brand_id" name="brand_id">
                                    <option value="">بدون برند</option>
                                    {% for brand in brands %}
                                    <option value="{{ brand.id }}" {% if product.brand_id == brand.id %}selected{% endif %}>{{ brand.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="stock_quantity" class="form-label">موجودی *</label>
                                <input type="number" class="form-control" id="stock_quantity" name="stock_quantity" min="0" value="{{ product.stock_quantity }}" required>
                            </div>
                            <div class="col-md-3">
                                <label for="bulk_price_cash" class="form-label">قیمت عمده نقدی (ریال) *</label>
                                <input type="number" class="form-control" id="bulk_price_cash" name="bulk_price_cash" step="0.01" min="0" value="{{ product.bulk_price_cash }}" required>
                            </div>
                            <div class="col-md-3">
                                <label for="retail_price_cash" class="form-label">قیمت تکی نقدی (ریال) *</label>
                                <input type="number" class="form-control" id="retail_price_cash" name="retail_price_cash" step="0.01" min="0" value="{{ product.retail_price_cash }}" required>
                            </div>
                            <div class="col-md-3">
                                <label for="bulk_price_check" class="form-label">قیمت عمده چکی (ریال) *</label>
                                <input type="number" class="form-control" id="bulk_price_check" name="bulk_price_check" step="0.01" min="0" value="{{ product.bulk_price_check }}" required>
                            </div>
                            <div class="col-md-3">
                                <label for="retail_price_check" class="form-label">قیمت تکی چکی (ریال) *</label>
                                <input type="number" class="form-control" id="retail_price_check" name="retail_price_check" step="0.01" min="0" value="{{ product.retail_price_check }}" required>
                            </div>
                            <div class="col-md-4">
                                <label for="settlement_period" class="form-label">مدت تسویه (روز)</label>
                                <input type="number" class="form-control" id="settlement_period" name="settlement_period" min="0" value="{{ product.settlement_period or 0 }}">
                            </div>
                            <div class="col-md-4">
                                <label for="credit_amount" class="form-label">مبلغ اعتبار (ریال)</label>
                                <input type="number" class="form-control" id="credit_amount" name="credit_amount" step="0.01" min="0" value="{{ product.credit_amount or 0 }}">
                            </div>
                            <div class="col-md-4">
                                <label for="cash_discount_percentage" class="form-label">درصد تخفیف نقدی</label>
                                <input type="number" class="form-control" id="cash_discount_percentage" name="cash_discount_percentage" step="0.1" min="0" max="100" value="{{ product.cash_discount_percentage or 0 }}">
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if product.is_active %}checked{% endif %}>
                                    <label class="form-check-label" for="is_active">
                                        محصول فعال است
                                    </label>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-save me-2"></i>ذخیره تغییرات
                                </button>
                                <a href="{{ url_for('admin_products') }}" class="btn btn-secondary">
                                    <i class="fas fa-times me-2"></i>انصراف
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
