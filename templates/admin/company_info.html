{% extends "base.html" %}

{% block title %}اطلاعات شرکت - شرکت بازرگانی قطعات خودرو آسیا سلمان{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <!-- Admin Sidebar -->
        <div class="col-lg-2">
            <div class="admin-sidebar">
                <div class="p-3">
                    <h5 class="text-white mb-4">
                        <i class="fas fa-cog me-2"></i>مدیریت سایت
                    </h5>
                    <nav class="nav flex-column">
                        <a class="nav-link" href="{{ url_for('admin_dashboard') }}">
                            <i class="fas fa-tachometer-alt me-2"></i>داشبورد
                        </a>
                        <a class="nav-link" href="{{ url_for('admin_products') }}">
                            <i class="fas fa-boxes me-2"></i>محصولات
                        </a>
                        <a class="nav-link" href="{{ url_for('admin_brands') }}">
                            <i class="fas fa-star me-2"></i>برندها
                        </a>
                        <a class="nav-link" href="{{ url_for('admin_vehicle_types') }}">
                            <i class="fas fa-car me-2"></i>انواع خودرو
                        </a>
                        <a class="nav-link" href="{{ url_for('admin_announcements') }}">
                            <i class="fas fa-bullhorn me-2"></i>اطلاعیه‌ها
                        </a>
                        <a class="nav-link active" href="{{ url_for('admin_company_info') }}">
                            <i class="fas fa-building me-2"></i>اطلاعات شرکت
                        </a>
                        <a class="nav-link" href="{{ url_for('excel_reconstruction') }}">
                            <i class="fas fa-file-excel me-2"></i>واردات اکسل
                        </a>
                    </nav>
                </div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="col-lg-10">
            <!-- Company Info Form -->
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">
                        <i class="fas fa-building me-2"></i>اطلاعات شرکت
                    </h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('admin_update_company_info') }}">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="company_name" class="form-label">نام شرکت *</label>
                                <input type="text" class="form-control" id="company_name" name="company_name" 
                                       value="{{ company_info.company_name or '' }}" required>
                            </div>
                            <div class="col-12">
                                <label for="description" class="form-label">توضیحات شرکت</label>
                                <textarea class="form-control" id="description" name="description" rows="4">{{ company_info.description or '' }}</textarea>
                            </div>
                            <div class="col-12">
                                <label for="address" class="form-label">آدرس</label>
                                <textarea class="form-control" id="address" name="address" rows="3">{{ company_info.address or '' }}</textarea>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">شماره تلفن</label>
                                <input type="tel" class="form-control" id="phone" name="phone" 
                                       value="{{ company_info.phone or '' }}">
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">ایمیل</label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="{{ company_info.email or '' }}">
                            </div>
                            <div class="col-12">
                                <label for="bulk_purchase_conditions" class="form-label">شرایط خرید عمده</label>
                                <textarea class="form-control" id="bulk_purchase_conditions" name="bulk_purchase_conditions" rows="6">{{ company_info.bulk_purchase_conditions or '' }}</textarea>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-save me-2"></i>ذخیره تغییرات
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
