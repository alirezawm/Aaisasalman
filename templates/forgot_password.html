{% extends "base.html" %}

{% block title %}فراموشی رمز عبور - شرکت بازرگانی قطعات خودرو آسیا سلمان{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-danger text-white text-center">
                    <h4 class="mb-0">
                        <i class="fas fa-key me-2"></i>بازیابی رمز عبور
                    </h4>
                </div>
                <div class="card-body p-4">
                    <!-- Step 1: Enter Username or Phone -->
                    <div id="step1-form">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-lock fa-3x text-danger mb-3"></i>
                            <p class="text-muted">
                                برای بازیابی رمز عبور، نام کاربری یا شماره تلفن خود را وارد کنید
                            </p>
                        </div>
                        
                        <form method="POST" id="forgot-password-form">
                            <input type="hidden" name="action" value="send_otp">
                            
                            <div class="mb-3">
                                <label for="identifier" class="form-label">نام کاربری یا شماره تلفن</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <input type="text" 
                                           class="form-control" 
                                           id="identifier" 
                                           name="identifier" 
                                           placeholder="نام کاربری یا 09123456789"
                                           required
                                           autocomplete="username">
                                </div>
                                <div class="form-text">نام کاربری یا شماره تلفن خود را وارد کنید</div>
                            </div>
                            
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-danger btn-lg" id="submitBtn">
                                    <i class="fas fa-paper-plane me-2"></i>ارسال کد تأیید
                                </button>
                            </div>
                            
                            <div class="text-center">
                                <a href="{{ url_for('login') }}" class="text-decoration-none">
                                    <i class="fas fa-arrow-right me-1"></i>بازگشت به صفحه ورود
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('forgot-password-form');
    const identifierInput = document.getElementById('identifier');
    const submitBtn = document.getElementById('submitBtn');
    
    // Auto-format phone number if entered
    identifierInput.addEventListener('input', function(e) {
        const value = this.value;
        // If it looks like a phone number (starts with 9 or 0), format it
        if (/^[0-9]/.test(value)) {
            // Only allow numbers
            this.value = value.replace(/[^0-9]/g, '');
            
            // Auto-add 0 if starts with 9
            if (this.value.length > 0 && this.value[0] === '9' && this.value.length <= 10) {
                this.value = '0' + this.value;
            }
        }
    });
    
    // Handle form submission
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const identifier = identifierInput.value.trim();
        
        // Validate input
        if (!identifier) {
            showAlert('لطفاً نام کاربری یا شماره تلفن را وارد کنید', 'danger');
            identifierInput.focus();
            return;
        }
        
        // Disable button and show loading
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>در حال ارسال...';
        
        // Submit form
        form.submit();
    });
    
    function showAlert(message, type) {
        // Remove existing alerts
        const existingAlerts = document.querySelectorAll('.alert');
        existingAlerts.forEach(alert => alert.remove());
        
        // Create new alert
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        
        // Insert at top of card body
        const cardBody = document.querySelector('.card-body');
        cardBody.insertBefore(alertDiv, cardBody.firstChild);
        
        // Auto-remove after 5 seconds
        setTimeout(() => {
            if (alertDiv.parentNode) {
                alertDiv.remove();
            }
        }, 5000);
    }
    
    // Focus on input
    identifierInput.focus();
});
</script>
{% endblock %}
