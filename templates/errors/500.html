{% extends "base.html" %}

{% block title %}خطای سرور - 500 | آسیا سلمان{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="error-page">
                <h1 class="error-code">500</h1>
                <h2 class="error-title">خطای سرور</h2>
                <p class="error-message">
                    متأسفانه خطایی در سرور رخ داده است. لطفاً بعداً دوباره تلاش کنید.
                </p>
                <div class="error-actions">
                    <a href="{{ url_for('index') }}" class="btn btn-primary">
                        <i class="fas fa-home"></i> بازگشت به خانه
                    </a>
                    <button onclick="history.back()" class="btn btn-outline-primary">
                        <i class="fas fa-arrow-right"></i> بازگشت
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.error-page {
    padding: 3rem 0;
}

.error-code {
    font-size: 8rem;
    font-weight: bold;
    color: #dc3545;
    margin-bottom: 1rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
}

.error-title {
    color: #2c3e50;
    margin-bottom: 1rem;
}

.error-message {
    color: #6c757d;
    font-size: 1.1rem;
    margin-bottom: 2rem;
}

.error-actions .btn {
    margin: 0 0.5rem;
}

@media (max-width: 768px) {
    .error-code {
        font-size: 6rem;
    }
    
    .error-actions .btn {
        display: block;
        margin: 0.5rem 0;
        width: 100%;
    }
}
</style>
{% endblock %}
