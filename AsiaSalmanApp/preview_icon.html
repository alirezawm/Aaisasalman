<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیش‌نمایش آیکون Asia Salman</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 {
            color: #fff;
            margin-bottom: 40px;
            font-size: 24px;
        }
        .icons-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .icon-label {
            color: #aaa;
            font-size: 14px;
        }
        .icon-preview {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .icon-circle {
            border-radius: 50%;
            overflow: hidden;
        }
        .icon-rounded {
            border-radius: 22%;
            overflow: hidden;
        }
        svg {
            display: block;
        }
    </style>
</head>
<body>
    <h1>🎨 پیش‌نمایش آیکون اپلیکیشن Asia Salman</h1>
    
    <div class="icons-container">
        <!-- Large Square Icon -->
        <div class="icon-wrapper">
            <div class="icon-preview">
                <svg width="192" height="192" viewBox="0 0 108 108">
                    <!-- Red rounded square background (squircle) -->
                    <path fill="#D92027" d="M18,12 Q12,12 12,18 L12,90 Q12,96 18,96 L90,96 Q96,96 96,90 L96,18 Q96,12 90,12 Z"/>
                    <!-- White diagonal stripe (main A body) - top-left corner rounded -->
                    <path fill="#FFFFFF" d="M26,24 Q24,20 28,20 L46,20 L86,84 L64,84 Z"/>
                    <!-- White bottom horizontal bar - top-left and bottom-left corners rounded -->
                    <path fill="#FFFFFF" d="M22,54 Q18,54 18,58 L18,82 Q18,86 22,86 L64,86 L54,54 L22,54 Z"/>
                    <!-- Red triangular cutout (A hole - top) - top vertex rounded -->
                    <path fill="#D92027" d="M34,32 Q40,28 44,32 L50,32 L34,50 Z"/>
                    <!-- Red parallelogram cutout (A hole - bottom) - all sharp corners -->
                    <path fill="#D92027" d="M28,64 L48,64 L54,78 L28,78 Z"/>
                </svg>
            </div>
            <span class="icon-label">۱۹۲×۱۹۲ پیکسل</span>
        </div>

        <!-- Medium Rounded Icon -->
        <div class="icon-wrapper">
            <div class="icon-preview icon-rounded">
                <svg width="96" height="96" viewBox="0 0 108 108">
                    <path fill="#D92027" d="M18,12 Q12,12 12,18 L12,90 Q12,96 18,96 L90,96 Q96,96 96,90 L96,18 Q96,12 90,12 Z"/>
                    <path fill="#FFFFFF" d="M26,24 Q24,20 28,20 L46,20 L86,84 L64,84 Z"/>
                    <path fill="#FFFFFF" d="M18,54 Q18,50 22,50 L54,50 L64,84 L18,84 Q18,84 18,80 Q18,76 18,54 Z"/>
                    <path fill="#D92027" d="M34,32 Q40,28 44,32 L50,32 L34,50 Z"/>
                    <path fill="#D92027" d="M28,64 L48,64 L54,78 L28,78 Z"/>
                </svg>
            </div>
            <span class="icon-label">۹۶×۹۶ (گوشه گرد)</span>
        </div>

        <!-- Small Circle Icon -->
        <div class="icon-wrapper">
            <div class="icon-preview icon-circle">
                <svg width="72" height="72" viewBox="0 0 108 108">
                    <path fill="#D92027" d="M18,12 Q12,12 12,18 L12,90 Q12,96 18,96 L90,96 Q96,96 96,90 L96,18 Q96,12 90,12 Z"/>
                    <path fill="#FFFFFF" d="M26,24 Q24,20 28,20 L46,20 L86,84 L64,84 Z"/>
                    <path fill="#FFFFFF" d="M18,54 Q18,50 22,50 L54,50 L64,84 L18,84 Q18,84 18,80 Q18,76 18,54 Z"/>
                    <path fill="#D92027" d="M34,32 Q40,28 44,32 L50,32 L34,50 Z"/>
                    <path fill="#D92027" d="M28,64 L48,64 L54,78 L28,78 Z"/>
                </svg>
            </div>
            <span class="icon-label">۷۲×۷۲ (دایره)</span>
        </div>

        <!-- Extra Small -->
        <div class="icon-wrapper">
            <div class="icon-preview">
                <svg width="48" height="48" viewBox="0 0 108 108">
                    <path fill="#D92027" d="M18,12 Q12,12 12,18 L12,90 Q12,96 18,96 L90,96 Q96,96 96,90 L96,18 Q96,12 90,12 Z"/>
                    <path fill="#FFFFFF" d="M26,24 Q24,20 28,20 L46,20 L86,84 L64,84 Z"/>
                    <path fill="#FFFFFF" d="M18,54 Q18,50 22,50 L54,50 L64,84 L18,84 Q18,84 18,80 Q18,76 18,54 Z"/>
                    <path fill="#D92027" d="M34,32 Q40,28 44,32 L50,32 L34,50 Z"/>
                    <path fill="#D92027" d="M28,64 L48,64 L54,78 L28,78 Z"/>
                </svg>
            </div>
            <span class="icon-label">۴۸×۴۸ (کوچک)</span>
        </div>
    </div>
</body>
</html>
