# ========================================
# Logrotate Configuration
# Asia Salman Flask Application
# ========================================

# Application logs
/logs/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
    postrotate
        # Reload application if needed
        docker-compose restart web
    endscript
}

# Nginx logs
/nginx_logs/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 nginx nginx
    postrotate
        # Reload nginx
        docker-compose exec nginx nginx -s reload
    endscript
}

# Combined log rotation
/logs/combined.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 appuser appuser
}
